[package]
name = "fledge-plugin-coverage"
version = "0.2.0"
edition = "2021"
description = "Run language-native test coverage and gate on a threshold"
license = "MIT"
authors = ["CorvidLabs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
